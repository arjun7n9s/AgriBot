<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AgriBOT SCARA arm v2</title>
<!--
  Local viewer. Serve the repo root and open /tools/cad/viewer/:
      .venv-cad/Scripts/python -m http.server 8765
  /tools/cad/viewer/              arm v2 study: needs cad/arm-v2/preview/*.glb (build_arm_v2.py, export_stock_base.py)
  /tools/cad/viewer/?set=cutter   stock arm with cutter v1: needs cad/cutter/preview/*.glb (build_cutter.py,
                                  export_stock_arm.py)
-->
<style>
  html, body { margin: 0; height: 100%; font: 13px system-ui, sans-serif; background: #e9eaec; color: #222; overflow: hidden; }
  #panel { position: absolute; top: 10px; left: 10px; width: 270px; max-height: calc(100% - 20px); overflow: auto;
           background: rgba(255,255,255,.92); border-radius: 8px; padding: 10px 12px; box-shadow: 0 1px 6px rgba(0,0,0,.15); }
  h1 { font-size: 15px; margin: 0 0 6px; }
  .grp { margin: 6px 0; }
  .grp > label { font-weight: 600; }
  details { margin: 4px 0 4px 4px; }
  details label { display: block; font-size: 12px; cursor: pointer; padding: 1px 0; }
  details label:hover { color: #1a7f4b; }
  #tip { position: absolute; pointer-events: none; background: #222; color: #fff; padding: 3px 7px; border-radius: 4px;
         font-size: 12px; display: none; }
  #status { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); background: rgba(255,255,255,.9);
            padding: 4px 10px; border-radius: 6px; }
  button { font: inherit; margin: 2px 2px 2px 0; }
</style>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.164.1/build/three.module.js",
               "three/addons/": "https://unpkg.com/three@0.164.1/examples/jsm/" } }
</script>
</head>
<body>
<div id="panel">
  <h1 id="title">SCARA arm v2</h1>
  <div>Drag to orbit, right-drag to pan, scroll to zoom. Hover a part for its name; click to isolate.</div>
  <div class="grp"><button id="all">Show all</button><button id="fit">Fit view</button><button id="xray">X-ray</button></div>
  <div id="groups"></div>
</div>
<div id="tip"></div>
<div id="status">Loading…</div>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(devicePixelRatio);
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xe9eaec);
const camera = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.001, 100);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
scene.add(new THREE.HemisphereLight(0xffffff, 0x8a8f96, 1.6));
const sun = new THREE.DirectionalLight(0xffffff, 1.8); sun.position.set(1, 2, 1.5); scene.add(sun);
const fill = new THREE.DirectionalLight(0xffffff, 0.6); fill.position.set(-1.5, 0.5, -1); scene.add(fill);

const SETS = {
  armv2: { title: "SCARA arm v2", dir: "../../../cad/arm-v2/preview/",
           files: [["Stock base, Z column and carriage (built)", "stock_base.glb"],
                   ["Arm v2 and cutter (to print)", "arm_v2.glb"]] },
  cutter: { title: "Stock SCARA with cutter v1", dir: "../../../cad/cutter/preview/",
            files: [["Stock SCARA (HowToMechatronics)", "stock_arm.glb"],
                    ["Cutter v1, open, with a reference stem and tomato", "cutter_on_arm.glb"]] },
};
const set = SETS[new URLSearchParams(location.search).get("set")] || SETS.armv2;
const files = set.files;
document.title = "AgriBOT " + set.title; document.getElementById("title").textContent = set.title;
const loader = new GLTFLoader();
const root = new THREE.Group(); scene.add(root);
const parts = [];          // { name, obj, group }
let xray = false;

function nice(n) { return n.replace(/_/g, " ").replace(/\s+/g, " ").trim(); }

function addGroup(title, gltf) {
  const g = gltf.scene; root.add(g);
  const box = document.createElement("div"); box.className = "grp";
  const head = document.createElement("label");
  const cb = document.createElement("input"); cb.type = "checkbox"; cb.checked = true;
  cb.onchange = () => { g.visible = cb.checked; };
  head.append(cb, " " + title); box.append(head);
  const det = document.createElement("details"); const sum = document.createElement("summary");
  sum.textContent = "parts"; det.append(sum);
  // top-level named children are the parts
  const kids = g.children.length === 1 && g.children[0].children.length ? g.children[0].children : g.children;
  for (const k of kids) {
    const p = { name: nice(k.name || "part"), obj: k, group: g };
    parts.push(p);
    k.traverse(o => { if (o.isMesh) { o.userData.part = p; o.material = o.material.clone();
      o.material.side = THREE.DoubleSide; o.userData.baseOpacity = 1; } });
    const l = document.createElement("label"); const c = document.createElement("input");
    c.type = "checkbox"; c.checked = true; c.onchange = () => { k.visible = c.checked; }; p.cb = c;
    l.append(c, " " + p.name); det.append(l);
  }
  box.append(det); document.getElementById("groups").append(box);
}

function fit() {
  const b = new THREE.Box3();
  root.traverse(o => { if (o.isMesh && isShown(o)) b.expandByObject(o); });
  if (b.isEmpty()) b.setFromObject(root);
  const c = b.getCenter(new THREE.Vector3());
  const r = b.getSize(new THREE.Vector3()).length() / 2;
  controls.target.copy(c);
  camera.position.copy(c).add(new THREE.Vector3(1.1, 0.75, 1.3).normalize().multiplyScalar(r * 2.6));
  camera.near = r / 100; camera.far = r * 50; camera.updateProjectionMatrix();
}

Promise.all(files.map(([t, f]) => loader.loadAsync(set.dir + f).then(g => [t, g])))
  .then(list => { for (const [t, g] of list) addGroup(t, g); fit();
                  document.getElementById("status").textContent = `${parts.length} parts`; })
  .catch(e => { document.getElementById("status").textContent = "Load failed: " + e.message; console.error(e); });

document.getElementById("fit").onclick = fit;
document.getElementById("all").onclick = () => { for (const p of parts) { p.obj.visible = true; p.cb.checked = true; }
  for (const g of root.children) g.visible = true;
  document.querySelectorAll("#groups > .grp > label > input").forEach(c => c.checked = true); };
document.getElementById("xray").onclick = () => { xray = !xray;
  root.traverse(o => { if (o.isMesh) { o.material.transparent = xray; o.material.opacity = xray ? 0.35 : 1;
    o.material.depthWrite = !xray; } }); };

const ray = new THREE.Raycaster(); const mouse = new THREE.Vector2(); const tip = document.getElementById("tip");
let hovered = null;
function pick(e) {
  mouse.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(mouse, camera);
  const hit = ray.intersectObjects(root.children, true).find(h => h.object.visible && isShown(h.object));
  return hit ? hit.object.userData.part : null;
}
function isShown(o) { for (let x = o; x; x = x.parent) if (!x.visible) return false; return true; }
function glow(p, on) { if (!p) return; p.obj.traverse(o => { if (o.isMesh) o.material.emissive?.setHex(on ? 0x335533 : 0); }); }
renderer.domElement.addEventListener("pointermove", e => {
  const p = pick(e);
  if (p !== hovered) { glow(hovered, false); glow(p, true); hovered = p; }
  if (p) { tip.style.display = "block"; tip.style.left = e.clientX + 12 + "px"; tip.style.top = e.clientY + 12 + "px";
           tip.textContent = p.name; } else tip.style.display = "none";
});
let down = null;
renderer.domElement.addEventListener("pointerdown", e => { down = [e.clientX, e.clientY]; });
renderer.domElement.addEventListener("pointerup", e => {
  if (!down || Math.hypot(e.clientX - down[0], e.clientY - down[1]) > 4) return;
  const p = pick(e); if (!p) return;
  for (const q of parts) { q.obj.visible = q === p; q.cb.checked = q === p; }
});
addEventListener("resize", () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); });
renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });
</script>
</body>
</html>
