controller_manager:
  ros__parameters:
    update_rate: 100
    use_sim_time: true

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    wheel_controller:
      type: velocity_controllers/JointGroupVelocityController
    steering_controller:
      type: position_controllers/JointGroupPositionController
    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    tool_controller:
      type: position_controllers/JointGroupPositionController
    scout_controller:
      type: position_controllers/JointGroupPositionController

wheel_controller:
  ros__parameters:
    joints: [front_left_wheel_joint, front_right_wheel_joint, rear_left_wheel_joint, rear_right_wheel_joint]

steering_controller:
  ros__parameters:
    joints: [steer_joint]

arm_controller:
  ros__parameters:
    joints: [scara_j1, scara_z, scara_j2, scara_j3]
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    allow_partial_joints_goal: true
    open_loop_control: true
    constraints:
      goal_time: 2.0
      stopped_velocity_tolerance: 0.05

tool_controller:
  ros__parameters:
    joints: [scara_cutter_blade_joint, scara_cutter_door_joint]

scout_controller:
  ros__parameters:
    joints: [scout_pan_joint]

# Position commands in gz_ros2_control are followed with a P gain on velocity.
gz_ros2_control:
  ros__parameters:
    position_proportional_gain: 0.5
